# =============================================================
# WMS web 容器内 nginx 配置（注意：这是容器内 nginx，不是宿主机 nginx！）
# 职责：
#   1. 托管 Vite 构建产物（SPA history 路由 → try_files 回退 index.html）
#   2. /api/     → 反代到 api 容器 uvicorn:8080（保留 /api 前缀，后端路由自带 /api）
#   3. /uploads/ → 反代到 api 容器（照片静态访问，兼容后端两种挂载路径）
# 上游入口：宿主机 nginx 443 → 127.0.0.1:WMS_WEB_PORT → 本容器 :80
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 照片上传（手机拍照直传，留足体积）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/pdf image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ---- API 反代（保留 /api 前缀原样转发） ----
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 宿主机 nginx 已设置 X-Forwarded-For/Proto，这里透传追加
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;   # 标签 PDF 批量生成可能较慢
        proxy_read_timeout    120s;
        proxy_buffering off;          # 大 PDF/xlsx 下载流式透传
    }

    # ---- 照片静态访问兜底（若后端把 uploads 挂在根路径 /uploads/...） ----
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 静态资源长缓存（Vite 产物文件名带 hash） ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后前端立即拿到新 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
